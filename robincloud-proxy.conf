# RobinCloud sits behind the Cloudflare tunnel, so Apache itself only ever
# sees plain http. X-Forwarded-Proto says how the visitor actually came in.

# HSTS only when the request reached the tunnel over HTTPS (the SSH-forwarded
# http://localhost:8080 stays plain). One year, same as the site and webmail.
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
# Files-only cloud: no page here needs camera, mic, location, payments or USB
# (same list as the webmail)
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
# Nextcloud still sends the old Feature-Policy naming the same features, and
# browsers warn about the pair on every page (Permissions-Policy wins anyway;
# its autoplay and fullscreen 'self' are the defaults)
Header unset Feature-Policy
# (the CalDAV/CardDAV https redirect lives in .htaccess, which runs first)

# Pages go out with no-transform, so Cloudflare passes them as they are
# instead of unpacking them to add its analytics beacon, which the page's CSP
# blocks anyway (a console error on every page). Apache's gzip then reaches
# the browser, smaller than Cloudflare's brotli of the page with the beacon in
# it (5771 against 6078 bytes for /login). merge keeps Nextcloud's own
# Cache-Control and appends this.
Header merge Cache-Control "no-transform" "expr=%{CONTENT_TYPE} =~ m#^text/html#"

# Scripts, styles and icons leave here uncompressed, so Cloudflare compresses
# each one for the browser that asks (brotli or zstd). Apache's gzip was cached
# and passed on as it was, even to browsers that take brotli: core-common.js,
# the 5.8MB bundle every page loads, went out as 1.22MB where brotli is about
# 1.02MB (B-126). Request_URI is the path, so ?v= and ?plain= don't hide it.
SetEnvIfNoCase Request_URI "\.(m?js|css|svg|json)$" no-gzip

# The login page's largest picture is the wordmark, a CSS background, so the
# browser only asked for it once every stylesheet had arrived, the theme ones
# PHP makes (about half a second each from Korea) included. Named here, it
# comes in alongside them. Since the icon tile (B-451) it is one file for both
# colour schemes, the very URL robincloud.css (#body-login #header .logo) asks
# for, ?v= included: change the two together, or the preload is fetched for
# nothing. THE_REQUEST is the line the browser sent, before the rewrite to
# index.php.
Header add Link "</core/img/favicon.svg?v=icon-20261123>; rel=preload; as=image" "expr=%{THE_REQUEST} =~ m#^GET /login[?\s]#"

# The ten theme stylesheets every page links in its head come from PHP as
# "private, max-age=86400, must-revalidate", so a browser asked for all ten
# again once a day, and each is a trip past Cloudflare (it keeps nothing
# marked private) to the server: from Korea, by way of Los Angeles, about
# half a second each and two or three when they go together, with the page
# held back until the last is in (2026-11-17). Their address carries ?v=, a
# hash of the server version, the theming counter and the person's own
# counter (theming Util::getCacheBuster), which moves whenever any of the
# three does, so a year is safe. Still private (a person's colours and
# background), and Set-Cookie is left alone: a session renewed on one of
# these requests must reach the browser.
Header set Cache-Control "private, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} == 200 && %{THE_REQUEST} =~ m#^GET /(?:index\.php/)?apps/theming/theme/[\w-]+\.css\?(?:[^ ]*&)?v=[0-9a-f]{8}(?:[& ]|$)#"

# Doors nobody here walks through answer 404 before Nextcloud runs (E12):
# - OAuth2 login for third-party apps: no OAuth client is registered (the
#   desktop and phone apps use login flow v2, /login/v2), and authorize
#   without its parameters was a 500 plus a level 3 line in robincloud.log
#   for any passer-by. If a client is ever added, drop this line.
# - Federated sharing (OCM): server-to-server sharing is off both ways, but
#   the inbound share API under /ocm/ and the /.well-known/ocm discovery were
#   still served. /ocm-provider/ and /ocs-provider/ stay, the admin overview
#   check wants them answering 200.
# - Source maps of the bundled scripts and styles (18 MB for core-common
#   alone): only browser dev tools ask for them. Anchored to the static
#   folders, so a user's own file named x.js.map under remote.php or
#   public.php is untouched.
# RedirectMatch sees the decoded path with // merged, so %6fcm or
# /index.php//ocm/ are caught too.
RedirectMatch 404 "^/(?:index\.php/)?(?:apps/oauth2/authorize|ocm(?:/|$)|\.well-known/ocm(?:/|$))"
RedirectMatch 404 "^/(?!apps/settings/js/map-test\.js\.map$)(?:dist|core|apps|custom_apps|themes)/.+\.(?:m?js|css)\.map$"
# - The placeholder doc pages upstream ships (English, links to nextcloud.com).
RedirectMatch 404 "^/core/doc(?:/|$)"
