# RobinCloud sits behind the Cloudflare tunnel, so Apache itself only ever
# sees plain http. X-Forwarded-Proto says how the visitor actually came in.

# HSTS only when the request reached the tunnel over HTTPS (the SSH-forwarded
# http://localhost:8080 stays plain). One year, same as the site and webmail.
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
# Files-only cloud: no page here needs camera, mic, location, payments or USB
# (same list as the webmail)
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
# (the CalDAV/CardDAV https redirect lives in .htaccess, which runs first)

# Scripts, styles and icons leave here uncompressed, so Cloudflare compresses
# each one for the browser that asks (brotli or zstd). Apache's gzip was cached
# and passed on as it was, even to browsers that take brotli: core-common.js,
# the 5.8MB bundle every page loads, went out as 1.22MB where brotli is about
# 1.02MB (B-126). Request_URI is the path, so ?v= and ?plain= don't hide it.
SetEnvIfNoCase Request_URI "\.(m?js|css|svg|json)$" no-gzip
