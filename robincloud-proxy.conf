# RobinCloud sits behind the Cloudflare tunnel, so Apache itself only ever
# sees plain http. X-Forwarded-Proto says how the visitor actually came in.

# HSTS only when the request reached the tunnel over HTTPS (the SSH-forwarded
# http://localhost:8080 stays plain)
Header always set Strict-Transport-Security "max-age=15552000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
# (the CalDAV/CardDAV https redirect lives in .htaccess, which runs first)
