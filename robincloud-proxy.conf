# RobinCloud sits behind the Cloudflare tunnel, so Apache itself only ever
# sees plain http. X-Forwarded-Proto says how the visitor actually came in.

# HSTS only when the request reached the tunnel over HTTPS (the SSH-forwarded
# http://localhost:8080 stays plain). One year, same as the site and webmail.
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
# Files-only cloud: no page here needs camera, mic, location, payments or USB
# (same list as the webmail)
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
# Nextcloud still sends the old Feature-Policy naming the same features, and
# browsers warn about the pair on every page (Permissions-Policy wins anyway;
# its autoplay and fullscreen 'self' are the defaults)
Header unset Feature-Policy
# (the CalDAV/CardDAV https redirect lives in .htaccess, which runs first)

# Pages go out with no-transform, so Cloudflare passes them as they are
# instead of unpacking them to add its analytics beacon, which the page's CSP
# blocks anyway (a console error on every page). Apache's gzip then reaches
# the browser, smaller than Cloudflare's brotli of the page with the beacon in
# it (5771 against 6078 bytes for /login). merge keeps Nextcloud's own
# Cache-Control and appends this.
Header merge Cache-Control "no-transform" "expr=%{CONTENT_TYPE} =~ m#^text/html#"

# Scripts, styles and icons leave here uncompressed, so Cloudflare compresses
# each one for the browser that asks (brotli or zstd). Apache's gzip was cached
# and passed on as it was, even to browsers that take brotli: core-common.js,
# the 5.8MB bundle every page loads, went out as 1.22MB where brotli is about
# 1.02MB (B-126). Request_URI is the path, so ?v= and ?plain= don't hide it.
SetEnvIfNoCase Request_URI "\.(m?js|css|svg|json)$" no-gzip

# The login page's largest picture is the wordmark, a CSS background, so the
# browser only asked for it once every stylesheet had arrived, the theme ones
# PHP makes (about half a second each from Korea) included. Named here, it
# comes in alongside them. Which file goes with which colour scheme follows
# robincloud.css (#body-login #header .logo). THE_REQUEST is the line the
# browser sent, before the rewrite to index.php.
Header add Link "</core/img/logo/logo-dark.svg>; rel=preload; as=image; media=\"(prefers-color-scheme: light)\"" "expr=%{THE_REQUEST} =~ m#^GET /login[?\s]#"
Header add Link "</core/img/logo/logo.svg>; rel=preload; as=image; media=\"(prefers-color-scheme: dark)\"" "expr=%{THE_REQUEST} =~ m#^GET /login[?\s]#"
