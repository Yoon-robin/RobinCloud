; RobinCloud PHP tuning, loaded after the image's opcache-recommended.ini.
; The server has ~8 GB of RAM and RobinCloud is its biggest PHP user.

; Nextcloud 34 ships more PHP files than the image's 10000 OPcache slots, so
; some were recompiled on every request once the cache filled up
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.jit_buffer_size=32M

; APCu holds Nextcloud's local cache (memcache.local); 32M fills quickly
apc.shm_size=128M

; no PHP version in every response header (X-Powered-By)
expose_php=Off
